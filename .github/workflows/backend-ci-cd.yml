name: Backend Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'common-library/**'
      - 'portfolio-service/**'
      - 'notification-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'common-library/**'
      - 'portfolio-service/**'
      - 'notification-service/**'

jobs:
  build-test-and-package:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Install Common Library
        run: |
          cd common-library
          mvn clean install -DskipTests

      - name: Compile Portfolio Service
        run: |
          cd portfolio-service
          mvn clean compile -DskipTests

      - name: Compile Notification Service
        run: |
          cd notification-service
          mvn clean compile -DskipTests

      - name: Verify Docker Image Build - Portfolio Service
        run: |
          docker build -t portfolio-service:latest ./portfolio-service

      - name: Verify Docker Image Build - Notification Service
        run: |
          docker build -t notification-service:latest ./notification-service
