name: Backend Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    name: Backend Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Monorepo (Common Library + Microservices)
        run: mvn clean package -DskipTests

      - name: SonarCloud Code Analysis & Quality Gate
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar -Dsonar.projectKey=satheesh1501_portfolio -Dsonar.organization=satheesh1501 -Dsonar.host.url=https://sonarcloud.io

      - name: Verify Docker Image Build - Portfolio Service
        run: |
          docker build -t portfolio-service:latest -f portfolio-service/Dockerfile .

      - name: Verify Docker Image Build - Notification Service
        run: |
          docker build -t notification-service:latest -f notification-service/Dockerfile .
