<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contact Form Submission</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { background: linear-gradient(135deg, #0284c7, #6366f1); padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; color: #ffffff; letter-spacing: 0.5px; }
        .content { padding: 24px; }
        .field-group { margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .field-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
        .field-value { font-size: 16px; color: #f1f5f9; font-weight: 500; }
        .message-box { background: #0f172a; padding: 16px; border-radius: 8px; border-left: 4px solid #6366f1; font-size: 15px; line-height: 1.6; color: #e2e8f0; white-space: pre-wrap; }
        .footer { background: #0f172a; padding: 16px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📬 Portfolio Contact Notification</h1>
        </div>
        <div class="content">
            <div class="field-group">
                <div class="field-label">Sender Name</div>
                <div class="field-value" th:text="${name}">Alex Johnson</div>
            </div>
            <div class="field-group">
                <div class="field-label">Sender Email</div>
                <div class="field-value" th:text="${email}">alex@example.com</div>
            </div>
            <div class="field-group">
                <div class="field-label">Subject</div>
                <div class="field-value" th:text="${subject}">Job Opportunity</div>
            </div>
            <div class="field-group">
                <div class="field-label">Submitted At</div>
                <div class="field-value" th:text="${submittedAt}">2026-07-27 12:00:00</div>
            </div>
            <div class="field-group" style="border-bottom: none;">
                <div class="field-label">Message Content</div>
                <div class="message-box" th:text="${message}">Message body here...</div>
            </div>
        </div>
        <div class="footer">
            Automated Notification from <strong>Satheesh Microservices Portfolio Platform</strong>
        </div>
    </div>
</body>
</html>
